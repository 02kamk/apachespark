site_name: Apache Spark com Delta Lake e Apache Iceberg
site_description: Trabalho de pesquisa de Engenharia de Dados — INSERT, UPDATE e DELETE em tabelas Delta e Iceberg com PySpark
site_author: Kamily Hilário das Luzes, Kauã Lucas Alves Barbosa
site_url: https://02kamk.github.io/apachespark/
repo_url: https://github.com/02kamk/apachespark
repo_name: apachespark
edit_uri: edit/main/docs/

nav:
  - Contexto do trabalho: index.md
  - Apache Spark (PySpark): spark.md
  - Delta Lake: delta.md
  - Apache Iceberg: iceberg.md

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/02kamk/apachespark
